# NX Shop's compose stack. The install writes .env beside this file with
# the answers to the manifest's options (NX_OPT_*), the panel's address
# and the claim code; `docker compose up -d` starts it.
services:
  shop:
    image: ghcr.io/nx-panel/shop:${NX_ADDON_VERSION:-latest}
    container_name: nx-shop
    restart: unless-stopped
    env_file: .env
    # One port with HTTPS on: no listener of its own for it, whatever the
    # image says (its :8443 is for an install from before, whose compose
    # file has no such line); install.sh sets :8443 for one it updates.
    environment:
      NX_HTTPS_LISTEN: "${NX_HTTPS_LISTEN:-}"
    # The port may be below 1024 — acme serves on 443 — and the image's
    # user is not root.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    ports:
      - "${NX_OPT_PORT:-8095}:${NX_OPT_PORT:-8095}"
      # With HTTPS on, the port above serves it. An install from before one
      # port has its HTTPS on :8443, published here; otherwise a loopback
      # port nothing uses.
      - "${NX_HTTPS_PUBLISH:-127.0.0.1::8443}"
      # The CA's HTTP-01 check (https=acme-http): port 80, else a loopback
      # port nothing uses.
      - "${NX_HTTP_PUBLISH:-127.0.0.1::8080}"
    volumes:
      - ./data:/data
